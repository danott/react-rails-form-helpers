<form action="/accounts/1" accept-charset="UTF-8" method="post">
  <input type="hidden" name="_method" value="patch" autocomplete="off">
  <input type="hidden" name="authenticity_token" value="token" autocomplete="off">
  <div class="field">
    <label for="account_name">Name</label>
    <input type="text" value="Jude" name="account[name]" id="account_name">
  </div>

  <div data-react-class="PreferencesFields" data-react-props='{"preferences":{"theme":"dark","notifications":{"email":"1","push":"0"}}}'></div>

  <input type="submit" name="commit" value="Update Account" data-disable-with="Update Account">
</form>
